*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d2b23;background:var(--bg)}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:3px solid var(--au)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--au);font-weight:800;letter-spacing:.14em;font-size:15px}.brand span{border-left:2px solid var(--au);padding-left:10px}.lg{height:44px;width:auto;display:block}.logobox{display:inline-block;background:#fff;border-radius:14px;padding:8px 14px;margin-bottom:14px}.logobox img{height:58px;width:auto;display:block}nav{display:flex;gap:8px;flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}h2,h3{color:var(--g);margin:.3em 0}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;background:var(--g);color:#fff;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;transition:.2s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}

.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 14px #0000000f;border-top:5px solid var(--au)}.cA{border-color:var(--A)}.cB{border-color:var(--B)}.cC{border-color:var(--C)}.cD{border-color:var(--D)}
.form label{display:block;font-weight:600;font-size:14px;color:var(--g)}input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--ln);border-radius:10px;font:inherit;background:#fff;margin-top:4px}input[type=radio],input[type=checkbox]{width:auto}

const G='1F5C3A',AU='C8962E',LG='EAF3EC',W=9638,no={style:BorderStyle.NONE,size:0,color:'FFFFFF'},ln={style:BorderStyle.SINGLE,size:4,color:'C9D6CD'},B4={top:ln,bottom:ln,left:ln,right:ln},B0={top:no,bottom:no,left:no,right:no};
const tx=(t,o={})=>new TextRun({text:String(t??'')||'—',font:'Calibri',size:21,...o});
const para=(t,o={},po={})=>new Paragraph({children:[tx(t,o)],spacing:{after:40},...po});
const cell=(ch,w,fill,b,o={})=>new TableCell({children:ch,width:{size:w,type:WidthType.DXA},shading:fill?{type:ShadingType.CLEAR,color:'auto',fill}:undefined,borders:b||B4,margins:{top:90,bottom:90,left:130,right:130},verticalAlign:VerticalAlign.CENTER,...o});

const rows=a=>tbl(a.map(([k,v])=>new TableRow({cantSplit:true,children:[cell([para(k,{bold:true,color:G})],2900,LG),cell([para(v)],W-2900)]})),[2900,W-2900]);
const H=t=>new Paragraph({keepNext:true,spacing:{before:280,after:110},border:{bottom:{style:BorderStyle.SINGLE,size:8,color:AU,space:3}},children:[tx(t.toUpperCase(),{bold:true,size:24,color:G})]});
const logo=Uint8Array.from(atob(LOGO.split(',')[1]),c=>c.charCodeAt(0));
const banner=tbl([new TableRow({children:[cell([new Paragraph({children:[new ImageRun({data:logo,type:'jpg',transformation:{width:150,height:60}})]})],2600,'FFFFFF',B0),cell([para('ADEL S.A.S. | ADEL INVEST',{bold:true,size:18,color:'E8C77A'}),para('FICHE DE DOSSIER FONCIER',{bold:true,size:38,color:'FFFFFF'}),para('Base de données foncière – AMI-01/2026/ADEL-INVEST',{size:20,color:'FFFFFF',italics:true})],W-2600,G,B0,{margins:{top:200,bottom:200,left:300,right:200}})]})],[2600,W-2600]);

const d=f.details||{};
const doc=new Document({creator:'ADEL INVEST',title:'Dossier '+f.numero,styles:{default:{document:{run:{font:'Calibri',size:21}}}},
sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:900,bottom:1000,left:1134,right:1134}}},
footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER,children:[tx('Document confidentiel – ADEL S.A.S. – Généré le '+new Date().toLocaleDateString('fr-FR')+' – Cette fiche n\u2019engage pas ADEL.',{size:16,color:'5A6B61'})]})]})},
children:[banner,new Paragraph({spacing:{after:120},children:[]}),info,
H('Porteur du projet'),rows([['Nom et prénoms',`${p?.prenoms||''} ${p?.nom||''}`],['Type de porteur',p?.type_porteur],['Téléphone',p?.telephone],['WhatsApp',p?.whatsapp]]),
H('Projet'),rows([['Catégorie',f.categorie+' – '+CATS[f.categorie]],['Modalité souhaitée',f.modalites],['Intitulé',f.titre],['Prix / loyer / budget (FCFA)',d.prix_budget]]),
H('Localisation'),rows([['Région',f.region],['Département',f.departement],['Commune',f.commune],['Village / quartier',f.village],['Coordonnées GPS',f.lat&&f.lng?f.lat+', '+f.lng:'']]),
H('Caractéristiques du terrain'),rows([['Superficie initiale (ha)',f.superficie],['Superficie disponible (ha)',f.superficie_disponible],['Accès à l\u2019eau',f.eau],['Accès routier',f.acces],['Énergie',f.energie]]),
H('Situation juridique'),rows([['Statut juridique',f.droit]]),
H('Description'),rows([['Observations',f.description]])]}]});
return (typeof window==="undefined"?Packer.toBuffer(doc):Packer.toBlob(doc))}
